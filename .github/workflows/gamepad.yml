name: BLE Gamepad — Otomatik Derleme

on:
  push:
    branches: [main, "arena/**"]
    tags: ["gamepad-v*"]
    paths:
      - "app-gamepad/**"
      - ".github/workflows/gamepad.yml"
  pull_request:
    paths:
      - "app-gamepad/**"
  workflow_dispatch:

jobs:
  build:
    name: APK derle (debug, imzalı)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-gamepad

    steps:
      - name: Kaynağı indir
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bileşenlerini güncelle
        run: |
          exec > >(tee ../sdk-setup.log) 2>&1
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::notice::sdkmanager PATH'te yok — cmdline-tools indiriliyor"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            (cd /tmp && unzip -q cmdtools.zip)
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tee ../sdk-setup.log
          sdkmanager --list --installed | grep -E "platforms;android-34|build-tools;34.0.0" || {
            echo "::error::android-34 kurulamadı (kaydedilen: /tmp/cmdtools.log)"
            exit 1
          }

      - name: Gradle ile derle
        run: |
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Hata özeti (başarısızsa)
        if: failure()
        run: |
          {
            echo '## Derleme hatası — son 80 satır'
            echo '```'
            tail -80 ../gradle-build.log 2>/dev/null || tail -80 ../sdk-setup.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Üretilen APK'ları listele
        run: ls -lh app/build/outputs/apk/debug/

      - name: APK'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ble-gamepad-debug
          path: app-gamepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Etikette → GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/gamepad-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-gamepad/app/build/outputs/apk/debug/app-debug.apk

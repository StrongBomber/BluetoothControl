name: BLE Gamepad — Otomatik Derleme

on:
  push:
    branches: [main, "arena/**"]
    tags: ["gamepad-v*"]
    paths:
      - "app-gamepad/**"
      - ".github/workflows/gamepad.yml"
  pull_request:
    paths:
      - "app-gamepad/**"
  workflow_dispatch:

jobs:
  build:
    name: APK derle (debug, imzalı)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-gamepad

    steps:
      - name: Kaynağı indir
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bileşenlerini güncelle
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Gradle ile derle
        run: ./gradlew --no-daemon --stacktrace assembleDebug
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2g"

      - name: Üretilen APK'ları listele
        run: ls -lh app/build/outputs/apk/debug/

      - name: APK'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ble-gamepad-debug
          path: app-gamepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Etikette → GitHub Release'e ekle
        if: startsWith(github.ref, 'refs/tags/gamepad-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-gamepad/app/build/outputs/apk/debug/app-debug.apk

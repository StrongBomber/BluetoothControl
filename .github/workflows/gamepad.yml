name: BLE Gamepad — Otomatik Derleme

on:
  push:
    branches: [main, "arena/**"]
    tags: ["gamepad-v*"]
    paths:
      - "app-gamepad/**"
      - ".github/workflows/gamepad.yml"
  pull_request:
    paths:
      - "app-gamepad/**"
  workflow_dispatch:
    inputs:
      release:
        description: "Release sürümü (örn. 0.1.0) — doluysa tag + GitHub Release oluşturur"
        required: false
        default: ""
        type: string

jobs:
  build:
    name: APK derle (debug, imzalı)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-gamepad

    steps:
      - name: Kaynağı indir
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK bileşenlerini güncelle
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          if ! command -v sdkmanager >/dev/null 2>&1; then
            echo "::error::sdkmanager PATH'te yok (ANDROID_HOME=$ANDROID_HOME) — cmdline-tools indiriliyor"
            curl -fsSL -o /tmp/cmdtools.zip \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            (cd /tmp && unzip -q cmdtools.zip)
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
            command -v sdkmanager >/dev/null 2>&1 || { echo "::error::cmdline-tools kurulamadı"; exit 1; }
          fi
          yes | sdkmanager --licenses > sdk-lic.log 2>&1 || true
          set +e
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > sdk-install.log 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::sdkmanager kurulumu başarısız rc=$rc — son 30 satır:"
            tail -30 sdk-install.log | sed 's/^/::error:: /'
            exit 1
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            echo "::error::platforms/android-34 dizini yok — ANDROID_HOME içeriği:"
            ls "$ANDROID_HOME" 2>&1 | sed 's/^/::error:: /'
            exit 1
          fi

      - name: Gradle ile derle
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee ../gradle-build.log

      - name: Üretilen APK'ları listele
        run: ls -lh app/build/outputs/apk/debug/

      - name: APK'yi artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ble-gamepad-debug
          path: app-gamepad/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: GitHub Release oluştur (etiketle veya manuel)
        if: startsWith(github.ref, 'refs/tags/gamepad-v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
        # continue-on-error: ajan token'inin release yazma izni olmayabilir;
        # APK artifact'a yine de yüklenir, release sonraki denemede oluşur.
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && format('gamepad-v{0}', inputs.release) || github.ref_name }}
          name: ${{ inputs.release != '' && format('BLE Gamepad v{0}', inputs.release) || format('BLE Gamepad ({0})', github.ref_name) }}
          files: |
            app-gamepad/app/build/outputs/apk/debug/app-debug.apk

      - name: Hata özeti (başarısızsa)
        if: failure()
        run: |
          log=""
          for f in ../gradle-build.log sdk-install.log sdk-lic.log; do
            if [ -f "$f" ]; then log="$f"; break; fi
          done
          if [ -n "$log" ]; then
            echo "::error::Derleme hatası — anahtar satırlar:"
            grep -aE "What went wrong|Caused by:|error: |^e: |FAILED|Execution failed for|Could not|Unrecognized|not found|Unsu" "$log" | head -30 | sed 's/^/::error:: /'
            echo "::error::— hata bloğu (What went wrong + 25 satır):"
            grep -aA 25 "What went wrong" "$log" | head -30 | sed 's/^/::error:: /'
            echo "::error::— son 15 satır:"
            tail -15 "$log" | sed 's/^/::error:: /'
          else
            echo "::error::Derleme günlüğü bulunamadı"
          fi
          {
            echo "## Derleme hatası — son 80 satır (${log:-yok})"
            echo '```'
            if [ -n "$log" ]; then tail -80 "$log"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

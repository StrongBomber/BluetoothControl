name: release

# Creates a GitHub Release from a version tag (e.g. v6.23.2).
# The APK is only published after it passes integrity verification.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Publish verified release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify APK before publishing
        run: python3 scripts/verify_release.py "Bluetooth Klavye & Fare.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Bluetooth Klavye & Fare.apk
            CHECKSUMS.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
